    <style>
        /* =========================
           01. 父元素設定區
        ========================= */

        @font-face {
            font-family: "Kurewa Gothic";
            src: url("https://cdn.jsdelivr.net/gh/max32002/kurewa-gothic@1.071/webfont/CJK%20TC/KurewaGothicCjkTc-Regular.woff2") format("woff2");

        body {
            margin: 0;
            min-width: 1200px;
            background-color: #f6eab8;

            font-family:
                "Kurewa Gothic",
                "Microsoft JhengHei",
                sans-serif;

            color: #863710;
        }


        /* =========================
           02. Banner 與視差效果
        ========================= */

        .hero-section {
            position: relative;
            width: 100%;
            height: 660px;
            overflow: hidden;
        }

        .banner {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .banner img {
            position: absolute;
            top: -38%;
            left: 0;

            width: 100%;
            height: 150%;

            object-fit: cover;
            object-position: center;
            display: block;

            transform: translate3d(0,
                    var(--parallax-y, 0px),
                    0);

            will-change: transform;
        }

        .banner::before {
            content: "";
            position: absolute;
            inset: 0;

            background-color: rgba(235, 221, 221, 0.68);
            z-index: 1;
            pointer-events: none;
        }

        .banner::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 80px;

            background: linear-gradient(to bottom,
                    transparent,
                    #decbad);

            z-index: 2;
            pointer-events: none;
        }


        /* =========================
           03. Banner 中央文字
        ========================= */

        .content {
            position: absolute;
            top: 44%;
            left: 50%;

            transform: translate(-50%, -50%);
            width: 900px;

            text-align: center;
            z-index: 2;
        }

        .content h1 {
            margin: 0 0 20px;
            font-size: 56px;
            color: #07142d;

            text-shadow:
                0 3px 8px rgba(246, 225, 255, 0.28);
        }

        .content p {
            margin: 0;
            font-size: 30px;
            font-weight: 600;
            line-height: 1.8;
            color: #480c43;

            text-shadow:
                0 2px 6px rgba(237, 250, 224, 0.28);
        }


        /* 導覽列 */

        .navbar {
            position: sticky;
            top: 20px;
            z-index: 20;

            width: 1000px;
            height: 80px;
            margin: -120px auto 40px;

            /* 導覽列預設背景：深棕色 */

            border-radius: 40px;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow:
                0 8px 25px rgba(140, 47, 0, 0.18);
        }

        .navbar a {
            margin: 0 15px;
            padding: 12px 22px;

            /* 預設文字：淺黃色 */
            color: #FFF1B8;

            font-size: 18px;
            font-weight: bold;

            text-decoration: none;
            border-radius: 20px;
            transition: 0.3s;

        .navbar a:hover {
            background-color: #FFF1B8;
            color: #8C2F00;
        }


        /* =========================
           05. 作品展示大容器
        ========================= */

        .wrap {
            width: 1100px;
            margin: 100px auto;
            scroll-margin-top: 150px;
        }

        /* 圖片與文字交錯排列 */
        .item {
            display: flex;
            align-items: center;

            gap: 80px;
            margin-bottom: 150px;
        }

        .item.reverse {
            flex-direction: row-reverse;
        }


        /* =========================
           06. 圖片容器
           
           square    正方形
           portrait  直式長方形
           landscape 橫式長方形

           已是固定模板
        ========================= */

        .pho {
            flex: 0 0 55%;
            min-width: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
            box-sizing: border-box;

            background-color: #fff6ed;
            border-radius: 30px;
            overflow: hidden;
        }

        /* 正方形：1:1 */
        .pho.square {
            aspect-ratio: 1 / 1;
        }

        /* 直式：4:5 */
        .pho.portrait {
            aspect-ratio: 4 / 5;
        }

        /* 橫式：3:2 */
        .pho.landscape {
            aspect-ratio: 3 / 2;
        }

        /* 保持原始比例不裁切 */
        .pho img {
            display: block;

            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;

            object-fit: contain;

            cursor: zoom-in;
            opacity: 1;

            transition: opacity 0.3s ease;
        }

        .pho img.fade-out {
            opacity: 0;
        }

        /* =========================
           07. 作品文字說明
        ========================= */

            flex: 1;
            min-width: 0;
        }

        .txt h2 {
            margin: 0 0 15px;
            font-size: 40px;
            color: #D96C06;

        .txt p {
            font-size: 18px;
            line-height: 2;
            color: #863710;

        /* =========================
           08. 圖片放大視窗
        ========================= */

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;

            padding: 30px;
            box-sizing: border-box;

            background-color: rgba(0, 0, 0, 0.9);

            justify-content: center;
            align-items: center;
        }

        .lightbox.active {

        }

        .lightbox img {
            max-width: 95%;
            max-height: 90vh;

            width: auto;
            height: auto;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;

            border: none;
            background: transparent;
            color: white;

            font-size: 45px;
            cursor: pointer;

    <!-- =========================
         JavaScript：Banner 視差
    ========================= -->

    <script>
        const hero = document.querySelector(".hero-section");
        const bannerImg = document.querySelector(".banner img");

        let ticking = false;

        function updateParallax() {
            const rect = hero.getBoundingClientRect();
            const heroHeight = hero.offsetHeight;

            if (rect.bottom > 0 &&
                rect.top < window.innerHeight) {

                const scrollDistance = Math.max(0, -rect.top);
                const maxMove = heroHeight * 0.15;

                const moveY = Math.min(
                    scrollDistance * 0.3,
                    maxMove
                );

                bannerImg.style.setProperty(
                    "--parallax-y",
                    `${moveY}px`
                );
            }

            ticking = false;
        }

        window.addEventListener("scroll", () => {
            if (!ticking) {
                requestAnimationFrame(updateParallax);
                ticking = true;
            }
        }, { passive: true });

        window.addEventListener("resize", updateParallax);
        updateParallax();
    </script>


    <!-- =========================
         JavaScript：作品輪播

         日後更新圖片：
         直接替換 images 資料夾內同名檔案

         播放速度：5000 = 5 秒
    ========================= -->

    <script>

        /* ====== 圖片資料設定區 ====== */

        /* ====== 圖片資料設定區 ====== */

        const galleries = [

            // 正方形作品：1:1
            {
                id: "square-img",

                images: [
                    "./IMG-artworks/square-1to1/01.jpg",
                    "./IMG-artworks/square-1to1/02.jpg",
                    "./IMG-artworks/square-1to1/03.jpg"
                ]
            },

            // 直式作品：4:5
            {
                id: "portrait-img",

                images: [
                    "./IMG-artworks/portrait-4to5/01.jpg",
                    "./IMG-artworks/portrait-4to5/02.jpg",
                    "./IMG-artworks/portrait-4to5/03.jpg",
                    "./IMG-artworks/portrait-4to5/04.jpg"
                ]
            },

            // 橫式作品：3:2
            {
                id: "landscape-img",

                images: [
                    "./IMG-artworks/landscape-3to2/01.jpg",
                    "./IMG-artworks/landscape-3to2/02.jpg",
                    "./IMG-artworks/landscape-3to2/03.jpg"
                ]
            }

        ];


        /* ====== 輪播設定 ====== */

        const SLIDE_INTERVAL = 5000;
        const FADE_DURATION = 500;


        /* ====== Lightbox ====== */

        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightbox-image");
        const closeButton = document.getElementById("lightbox-close");

        let activeImage = null;

        function openLightbox(img) {
            if (!img.complete || !img.naturalWidth) return;

            activeImage = img;
            lightboxImage.src = img.src;

            lightbox.classList.add("active");
            lightbox.setAttribute("aria-hidden", "false");

            document.body.style.overflow = "hidden";
            closeButton.focus();
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
            lightbox.setAttribute("aria-hidden", "true");

            document.body.style.overflow = "";
            lightboxImage.removeAttribute("src");

            if (activeImage) {
                activeImage.focus();
                activeImage = null;
            }
        }

        closeButton.addEventListener("click", closeLightbox);

        lightbox.addEventListener("click", function (e) {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" &&
                lightbox.classList.contains("active")) {
                closeLightbox();
            }
        });


        /* ====== 初始化順序輪播 ====== */

        galleries.forEach(function (gallery) {

            const img = document.getElementById(gallery.id);

            if (!img || gallery.images.length === 0) return;

            let index = 0;
            let changing = false;

            img.src = gallery.images[index];
            img.tabIndex = 0;
            img.setAttribute("role", "button");
            img.setAttribute("aria-label", "點擊放大作品");

            img.addEventListener("click", function () {
                openLightbox(img);
            });

            img.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    openLightbox(img);
                }
            });

            function nextImage() {

                if (lightbox.classList.contains("active")) return;
                if (changing || gallery.images.length < 2) return;

                changing = true;

                const nextIndex =
                    (index + 1) % gallery.images.length;

                const preloaded = new Image();

                preloaded.onload = function () {

                    if (lightbox.classList.contains("active")) {
                        changing = false;
                        return;
                    }

                    img.classList.add("fade-out");

                    setTimeout(function () {

                        // 防止切換過程中開啟放大視窗
                        if (lightbox.classList.contains("active")) {
                            img.classList.remove("fade-out");
                            changing = false;
                            return;
                        }

                        img.src = preloaded.src;
                        index = nextIndex;

                        requestAnimationFrame(function () {
                            img.classList.remove("fade-out");
                        });

                        changing = false;

                    }, FADE_DURATION);
                };

                preloaded.onerror = function () {
                    changing = false;
                };

                preloaded.src = gallery.images[nextIndex];
            }

            setInterval(nextImage, SLIDE_INTERVAL);

        });

    </script>
